
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authlab-backend
  labels:
    app: authlab-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: authlab-backend

  template:
    metadata:
      labels:
        app: authlab-backend

    spec:
      containers:
        - name: backend
          image: neerajdeveloper/authlab-backend:cedc4af
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/authLab"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "hello"
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: authlab-backend-service

spec:
  type: ClusterIP

  selector:
    app: authlab-backend

  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP

