
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authlab-frontend
  labels:
    app: authlab-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: authlab-frontend

  template:
    metadata:
      labels:
        app: authlab-frontend

    spec:
      containers:
        - name: frontend
          image: neerajdeveloper/authlab-frontend:5244ef7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: authlab-frontend-service

spec:
  type: ClusterIP

  selector:
    app: authlab-frontend

  ports:
    - port: 8081
      targetPort: 80
      protocol: TCP

