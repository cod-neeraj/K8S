
name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/authlab-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/authlab-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/authLab
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/Greeting/Greeting
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Update Kubernetes image references
        env:
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          updates = {
              Path("Deployment/frontend.yml"):
                  os.environ["FRONTEND_IMAGE"] + ":" + os.environ["IMAGE_TAG"],
              Path("Deployment/backend.yml"):
                  os.environ["BACKEND_IMAGE"] + ":" + os.environ["IMAGE_TAG"],
          }

          for path, image in updates.items():
              if not path.exists():
                  raise SystemExit(f"Missing Kubernetes manifest: {path}")

              content = path.read_text()
              updated, count = re.subn(
                  r"(?m)^(\s*image:\s*).+$",
                  lambda match: match.group(1) + image,
                  content,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(f"No image field found in {path}")

              path.write_text(updated)
              print(f"Updated {path} -> {image}")
          PY

      - name: Commit updated Kubernetes manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Deployment/frontend.yml Deployment/backend.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Kubernetes image tags [skip ci]"
            git push
          fi
