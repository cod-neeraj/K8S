services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authLab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hello
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authLab"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend/Greeting/Greeting
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/authLab
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: hello
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend/authLab
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
