
spring.application.name=Greeting

server.port=8080

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authLab}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hello}

spring.session.jdbc.initialize-schema=always
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator Health Checks (Kubernetes)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

